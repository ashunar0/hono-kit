name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example app: gen --check (CI is set), types, lint, format, tests, the lint rule tests, the import table in docs
      - run: pnpm -C examples/invoices check
      # The template: init → g domain → install → check, linked and packed
      - run: pnpm -C packages/hono-kit e2e
      - run: pnpm -C packages/hono-kit e2e:packed
