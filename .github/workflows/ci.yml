name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hono-kit itself: the lint rule tests, hnk prepare, the source checks
      - run: pnpm -C packages/hono-kit test
      # The template: init → g domain → install → check (with the type tests in scripts/e2e-typetests), linked and packed
      - run: pnpm -C packages/hono-kit e2e
      - run: pnpm -C packages/hono-kit e2e:packed
